[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quviai"
version = "0.1.0"
description = "Official Python SDK for the QUVIAI AI rendering API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "QUVIAI", email = "support@quvi.ai" }]
keywords = ["quviai", "ai", "image-generation", "rendering", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # zero external dependencies — pure Python stdlib

[project.urls]
Homepage = "https://quvi.ai"
Repository = "https://github.com/quvi-ai/python-sdk"
"Bug Tracker" = "https://github.com/quvi-ai/python-sdk/issues"
Security = "https://github.com/quvi-ai/python-sdk/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/quviai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
